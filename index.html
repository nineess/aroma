<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="scss/main.css">
    
</head>
<body>
    <header class="header">
        <div class="container">
                <div class="row">
                    <div class="col-4 header-logo">
                        AROMA
                    </div>
                    <div class="col-8 navigation">
                        <a href="#" class="header-link">Home</a>
                        <a href="#" class="header-link">About</a>
                        <a href="#" class="header-link">Menu</a>
                        <a href="#" class="header-link">Gallery</a>
                        <a href="#" class="header-link">Contact</a>
                    </div>
                </div>
        </div>
    </header>
    <section class="hero">
    <div class="container">
        <div class="row">

            <div class="col-12 col-md-5 hero-content">
                <h1 class="hero-title">Discover Your Perfect Coffee</h1>
                <p class="hero-text">
                    Freshly brewed coffee made with passion.
                </p>
                <a href="#" class="hero-button">Explore Menu</a>
            </div>

            <div class="col-12 col-md-7 hero-image">
                <img src="images/hero-coffe.jpg" alt="coffe">
            </div>

        </div>
    </div>
</section>

<section class="products">
    <div class="container">
        <h2>Popular Coffee</h2>
        <div class="row">
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="images/espreso (2).jpg" alt="espreso">
                    <h3>Espreso</h3>
                    <p>Perfect Espreso</p>
                    <button>Order Now</button>
                </div>
                
            </div>
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="images/cappuccino.jpg" alt="cappuccino">
                    <h3>Cappuccino</h3>
                    <p>Perfect Cappuccino</p>
                    <button>Order Now</button>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="images/latte.jpg" alt="latte">
                    <h3>Latte</h3>
                    <p>Perfect Latte</p>
                    <button>Order Now</button>
                </div>
            </div>
            

        </div>
    </div>
</section>







<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
